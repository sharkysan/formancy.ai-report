<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 744" width="1190" height="744" role="img" aria-labelledby="title description">
  <title id="title">Formancy Report: the packages in their layers</title>
  <desc id="description">A sketch of the packages of Formancy Report and its two apps, in the layers docs/architecture/05-building-blocks.md orders them in, each depending only on the packages drawn below it: report-spec and report-documents at the foot; report-core; report-builder-core, report-runtime and report-server-core; the builders, the two renderers, the test support, the form bridge, the data provider, the server and its client; and the Studio and the product pages at the top.</desc>
  <style>
    /* The room's colours, each named as @formancy/themes/room.css names it (0034, narrowed by 0079): an image cannot
       import the room, so each is typed here, and scripts/architecture.test.mjs holds it to the installed room.css. */
    .fill-ground { fill: #080a12; }
    .fill-glass { fill: rgb(17 22 36 / 74%); }
    .fill-text { fill: #eef1f8; }
    .fill-muted { fill: #95a0b4; }
    .fill-client { fill: #8b7bff; }
    .fill-server { fill: #3fe0d5; }
    .stroke-muted { stroke: #95a0b4; }
    .stroke-client { stroke: #8b7bff; }
    .stroke-server { stroke: #3fe0d5; }
    .pen { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    /* What is private, never published as a package: the one rule that dashes. */
    .private { stroke-dasharray: 7 5; }
    .name { font: 600 16px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .says { font: 15px 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .heading { font: 700 28px Archivo, 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
    .column { font: 600 15px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; }
    .layer { font: 14px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
  </style>
  <rect class="fill-ground" x="0" y="0" width="1190" height="744" rx="18"/>
  <text class="heading fill-text" x="24" y="52">Formancy Report, in its layers</text>
  <text class="says fill-muted" x="24" y="84">Each package depends only on the packages drawn below it. Violet is what a person edits with, teal what decides and prints a document.</text>
  <text class="column fill-client" x="128" y="120">EDIT</text>
  <text class="column fill-server" x="394" y="120">PRINT</text>
  <text class="column fill-muted" x="660" y="120">DATA IN</text>
  <text class="column fill-muted" x="926" y="120">SERVE</text>
  <text class="layer fill-muted" x="24" y="166">apps</text>

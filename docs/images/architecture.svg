<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img" aria-labelledby="title description">
  <title id="title">Formancy Report: the packages in their layers</title>
  <desc id="description">A sketch of the packages of Formancy Report and its two apps, in the layers docs/architecture/05-building-blocks.md orders them in, each depending only on the layers below it: report-spec and report-documents at the foot; report-core; report-builder-core, report-runtime and report-server-core; the builders, the two renderers, the form bridge, the data provider, the server and its client; the Studio and the product pages above them; and report-corpus, the private test support, beside them.</desc>
  <style>
    /* The room's colours, each named as @formancy/themes/room.css names it (0034): an image cannot import
       the room, so each is typed here, and scripts/architecture.test.mjs holds it to the installed room.css. */
    .fill-ground { fill: #080a12; }
    .fill-glass { fill: rgb(17 22 36 / 74%); }
    .fill-text { fill: #eef1f8; }
    .fill-muted { fill: #95a0b4; }
    .fill-client { fill: #8b7bff; }
    .fill-server { fill: #3fe0d5; }
    .stroke-edge-strong { stroke: rgb(255 255 255 / 15%); }
    .stroke-muted { stroke: #95a0b4; }
    .stroke-client { stroke: #8b7bff; }
    .stroke-server { stroke: #3fe0d5; }
    .pen { fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .private { stroke-dasharray: 7 5; }
    .name { font: 600 15px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .says { font: 13px 'IBM Plex Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .heading { font: 700 26px Archivo, 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif; }
    .column { font: 600 14px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.12em; }
    .layer { font: 13px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.08em; }
  </style>
  <rect class="fill-ground" x="0" y="0" width="1400" height="860" rx="18"/>
  <text class="heading fill-text" x="40" y="58">Formancy Report, in its layers</text>
  <text class="says fill-muted" x="40" y="88">Each layer depends only on the layers below it, and the test support beside them on the runtime. Violet is what a person edits with, teal what decides and prints the document.</text>
  <text class="column fill-client" x="174" y="126">EDIT</text>
  <text class="column fill-server" x="474" y="126">PRINT</text>

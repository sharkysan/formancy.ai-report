packages:
  - "packages/*"
  # Applications: private, never published, and built by turbo like the rest:
  # the Studio (apps/studio, decision 0013).
  - "apps/*"

# Packages whose install scripts may run. Nothing else's does.
allowBuilds:
  esbuild: true
  # Transitive through @angular/build and ng-packagr, which the Angular builder
  # compiles with. Each install script only builds a native addon from source
  # when no prebuilt one fits; the prebuilt ones arrive as optional packages,
  # as in formancy.ai-data, so the scripts never run.
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false

# Shared dependency versions live here so the packages cannot drift apart.
# They are formancy.ai-data's, so one machine serves both repositories.
catalog:
  # The TypeScript line formancy.ai compiles under: its Angular 22 declares
  # `typescript: ">=6.0 <6.1"`. The declarations this repository consumes from
  # @formancy/* were emitted by 6.0.x, and the Angular builder coming here will
  # need the same line, so there is one version across the repositories.
  typescript: ~6.0.3

  vitest: ^5.0.1
  "@vitest/coverage-v8": ^5.0.1

  # The accessibility floor, at formancy.ai's catalog version: the builders
  # are audited against the same rules as formancy's own builders.
  axe-core: ^4.13.0

  # The Studio's browser gates and its README pictures, measured in Chromium:
  # what jsdom cannot see -- layout, focus, colour. formancy.ai-data's
  # catalog version, so one browser revision serves both repositories.
  playwright: ^1.63.0

  tsdown: ^0.23.0
  publint: ^0.3.24
  "@arethetypeswrong/cli": ^0.18.5
  "@types/node": ^22.10.0

  # The repository's guards read YAML: the workflows' jobs and matrices.
  yaml: ^2.9.1

  # The guide's blocks are read as GitHub reads Markdown, nested in lists and
  # quotes and never inside an HTML comment, so the gate compiles the code a
  # reader sees (0015).
  marked: ^18.1.1

# Releases adopted on the day they were published, each at its exact
# version, as formancy.ai-data 0055 does; pnpm's minimum release age would
# otherwise hold them back for a day. scripts/upstream-deps.mjs refuses an
# exemption outside upstream, for a name or a range, or for a version the
# lockfile no longer installs. Formancy Data 0.1.0, published on
# 2026-10-16, for report-data-provider (0016). formancy 0.6.0, published on
# 2026-10-18, for the packages and the Studio's and the pages' room.
minimumReleaseAgeExclude:
  - '@formancy/data-client@0.1.0'
  - '@formancy/data-core@0.1.0'
  - '@formancy/expressions@0.6.0'
  - '@formancy/spec@0.6.0'
  - '@formancy/themes@0.6.0'

name: Release

# Publishing happens here and nowhere else. A release cut from a laptop cannot
# carry provenance -- the attestation is a statement by GitHub about which
# workflow, at which commit, produced the tarball, and only the workflow can
# make it.
#
# In formancy.ai-data's order (its 0035; here 0014): the gates CI runs,
# ending in the release report of this run; then, in a job that holds
# `contents: read` and no secret, every check on what would be published --
# the report first -- pinned by hash; then, only on a version tag's push,
# everything permanent, in one job that publishes only what was pinned and
# signs and attaches the report beside the SBOM. A `workflow_dispatch`
# rehearses all of it but that last job, on any branch, with no secret and no
# permission beyond reading the repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Third-party actions are pinned to commit hashes, with the tag in a comment.
#
# This workflow holds an npm token and an OIDC identity that can sign on the
# project's behalf. A tag is a mutable pointer: whoever controls an action's
# repository can move `v3` to different code, and that code would run here with
# both. Updating one means reading what changed and writing a new hash. That is
# the cost, and it is also the point.
permissions:
  contents: read

jobs:
  # Whether this run publishes, decided once. The condition is positive and
  # written in this one place: a dispatch can never satisfy it, and an output
  # that is missing is '', which is not 'true'. `release` names everything
  # this run writes -- the tag when publishing, `dry-run` otherwise -- so no
  # file name below is built from a ref, and a dispatch from `feat/x` cannot
  # put a `/` into a path.
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publishing: ${{ steps.mode.outputs.publishing }}
      release: ${{ steps.mode.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Publishing only on the push of a version tag
        id: mode
        env:
          PUBLISHING: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "publishing=$PUBLISHING" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISHING" = true ]; then
            echo "release=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "release=dry-run" >> "$GITHUB_OUTPUT"
          fi

      # The root manifest: scripts/bump.mjs moves every manifest to one version.
      - name: The version the packages say
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The tag is the claim; this checks the repository agrees with it. A tag
      # that says v0.1.0 on a tree that says 0.2.0 would publish the wrong
      # version under the right name, which is unfixable after the fact.
      - name: The tag and the manifests must agree
        if: steps.mode.outputs.publishing == 'true'
        env:
          RELEASE: ${{ steps.mode.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${RELEASE#v}" != "$VERSION" ]; then
            echo "::error::The tag is ${RELEASE} but the packages say ${VERSION}"
            exit 1
          fi
          echo "Releasing $VERSION"

  # Beside the gates, so a missing or refused token is red while they run
  # rather than after them. A rehearsal skips it and needs no secret.
  #
  # The token is a secret of the `npm` environment, whose deployment policy
  # admits only `v*` tags (REPO-METADATA.md): a repository secret would be
  # readable by a workflow on any branch a collaborator pushes. That policy
  # is a repository setting, which nothing in this repository can see.
  npm-token:
    needs: tag
    if: needs.tag.outputs.publishing == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: The npm token must work, and must not want an OTP
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set in the npm environment"
            exit 1
          fi
          WHO=$(npm whoami 2>&1) || {
            echo "::error::npm rejected the token: ${WHO}"
            exit 1
          }
          echo "Authenticated as ${WHO}"
          # A classic "Publish" token on an account set to auth-and-writes
          # demands a one-time password for every publish, and CI has no
          # terminal to type one into -- it fails AFTER the whole gate has run.
          if npm profile get 2>/dev/null | grep -q "auth-and-writes"; then
            echo "::warning::Account enforces 2FA on writes. The token must be an \
          Automation or Granular Access token, or publish will fail. See RELEASING.md."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Exactly the gates CI runs, with the release named, ending in the report
  # job, which builds the release report and the release body from what
  # every gate found and fails the run on its problems. No secret is passed:
  # the coverage upload never runs in a release.
  gates:
    needs: tag
    uses: ./.github/workflows/gates.yml
    with:
      release: ${{ needs.tag.outputs.release }}

  # Every check on what would be published, in a job that holds
  # `contents: read` and no secret. The report is this run's, green and
  # whole, at the release's version; each tarball is, byte for byte, the one
  # the install gate installed and ran, at that version, declaring and
  # carrying its licence; the release body the report job built exists and
  # fits. What it checked is pinned by sha256 as its outputs -- the report
  # and the tarballs before cdxgen runs, whose dependencies nothing locks,
  # the SBOM once it is checked against the report -- and `publish` refuses
  # anything it downloads that is not that. No cache is restored here: a
  # tag's run may restore one a main-branch run saved.
  check:
    needs: [tag, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checked: ${{ steps.report-checked.outputs.checked }}
      sbom: ${{ steps.sbom-checked.outputs.checked }}
    steps:
      - uses: actions/checkout@v4

      # Node alone: the checks below import nothing but Node's own modules,
      # and the workspace is not installed, so nothing reads it in place of
      # what ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: release-report
          path: release-report
      - uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs

      - name: The report and the tarballs are what this run gated
        id: report-checked
        env:
          RELEASE: ${{ needs.tag.outputs.release }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: node scripts/release/pins.mjs check --release "${RELEASE}" --version "${VERSION}" --report release-report release-tarballs >> "$GITHUB_OUTPUT"

      # A bill of materials for what actually ships, so a customer -- or an
      # auditor -- can answer "what is in this" without resolving it
      # themselves. It describes the artefact, not the workbench: the
      # tarballs pinned above, installed by npm into a project of their own
      # outside the checkout as a consumer installs them, with no lifecycle
      # script run and the peers left to the host that brings them, and
      # --required-only. cdxgen reading the workspace named its test tools as
      # required and left out tslib, which the Angular builder installs; the
      # v0.1.0 tag's first run was refused for it.
      - name: Generate a CycloneDX SBOM
        id: sbom
        env:
          RELEASE: ${{ needs.tag.outputs.release }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          mkdir "${RUNNER_TEMP}/formancy-report-sbom"
          cd "${RUNNER_TEMP}/formancy-report-sbom"
          printf '{ "name": "formancy-report", "version": "%s", "private": true }\n' "${VERSION}" > package.json
          npm install --ignore-scripts --legacy-peer-deps --no-audit --no-fund "${GITHUB_WORKSPACE}"/release-tarballs/*.tgz
          npx --yes @cyclonedx/cdxgen@12.8.4 \
            --type javascript \
            --required-only \
            --output "${GITHUB_WORKSPACE}/formancy-report-${RELEASE}-sbom.cdx.json" \
            --project-name formancy-report \
            --project-version "${VERSION}" \
            .

      # The SBOM is one, names every package this release publishes at its
      # version, every runtime dependency and every upstream package their
      # install brings, and each the report names at the version the suites
      # loaded.
      - name: The SBOM names what the suites loaded, and is pinned
        id: sbom-checked
        env:
          RELEASE: ${{ needs.tag.outputs.release }}
        run: node scripts/release/pins.mjs sbom --report release-report "formancy-report-${RELEASE}-sbom.cdx.json" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: formancy-report-${{ needs.tag.outputs.release }}-sbom.cdx.json
          if-no-files-found: error
          overwrite: true

  # Everything that cannot be taken back, and the only job with any
  # permission beyond reading. The job-level condition is the boundary: no
  # step here carries an `if` of its own, so a step added later is guarded
  # without anybody remembering to guard it. Nothing is installed or built
  # here; it publishes the tarballs `check` passed, and first refuses
  # anything it downloaded that is not what `check` pinned, and a report that
  # is not this run's, green and whole -- before anything is signed, and
  # again in the step that holds the npm token.
  #
  # Ordered so that npm, whose version numbers nothing can delete, comes as
  # late as possible: signatures, then npm, then the GitHub release, which can
  # be edited or deleted. A re-run of this job resumes: publish.mjs skips a
  # version npm already holds with the same bytes.
  publish:
    needs: [tag, npm-token, gates, check]
    if: needs.tag.outputs.publishing == 'true'
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub release
      id-token: write # OIDC, for npm provenance and keyless signing
    env:
      RELEASE: ${{ needs.tag.outputs.release }}
      VERSION: ${{ needs.tag.outputs.version }}
      CHECKED: ${{ needs.check.outputs.checked }}
      CHECKED_SBOM: ${{ needs.check.outputs.sbom }}
    steps:
      - id: checkout
        uses: actions/checkout@v4

      - id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - id: report
        uses: actions/download-artifact@v4
        with:
          name: release-report
          path: release-report
      - id: tarballs
        uses: actions/download-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs
      - id: sbom
        uses: actions/download-artifact@v4
        with:
          name: release-sbom
          path: .

      # Every file just downloaded is, byte for byte, one `check` pinned, and
      # the report is this run's, green and whole; or nothing is signed.
      - name: What was downloaded is what check checked
        id: downloads-checked
        run: node scripts/release/pins.mjs downloads --release "${RELEASE}" --version "${VERSION}" --report release-report release-tarballs "formancy-report-${RELEASE}-sbom.cdx.json"

      - id: cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless: the signature is bound to this workflow's OIDC identity rather
      # than to a private key somebody has to keep.
      - name: Sign the SBOM
        id: sign-sbom
        run: |
          cosign sign-blob --yes \
            --bundle "formancy-report-${RELEASE}-sbom.cdx.json.sigstore" \
            "formancy-report-${RELEASE}-sbom.cdx.json"

      # The report of the run that gated this release, signed by the same
      # identity, so a customer can check it is the one this workflow made.
      - name: Sign the release report
        id: sign-report
        run: |
          for kind in md json; do
            cp "release-report/release-report.${kind}" "formancy-report-${RELEASE}-release-report.${kind}"
            cosign sign-blob --yes \
              --bundle "formancy-report-${RELEASE}-release-report.${kind}.sigstore" \
              "formancy-report-${RELEASE}-release-report.${kind}"
          done

      # No container image yet: there is no server in this repository. When
      # the report server lands, its image is built, signed and attested here
      # the way formancy.ai-data's is, and not carried between jobs.

      # The tarballs the install gate packed, installed and ran, and `check`
      # held to the report and pinned: npm receives exactly those bytes, with
      # provenance. publish.mjs holds them, and the report, to the pin again
      # itself.
      - name: Publish to npm with provenance
        id: npm-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/release/publish.mjs --tarballs release-tarballs --report release-report

      # The body is this version's changelog section and the report's summary,
      # built and measured by the report job before anything was published.
      - name: Create the GitHub release
        id: github-release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-report/RELEASE_NOTES.md
          files: |
            formancy-report-*-sbom.cdx.json
            formancy-report-*-sbom.cdx.json.sigstore
            formancy-report-*-release-report.md
            formancy-report-*-release-report.md.sigstore
            formancy-report-*-release-report.json
            formancy-report-*-release-report.json.sigstore
          fail_on_unmatched_files: true

name: Gates

# The gates every change and every release passes, in one place (0014, as
# formancy.ai-data's 0035): ci.yml calls this on every pull request and every
# push to main, and release.yml calls it before anything is published, so a
# release's gate is CI's by construction and its report describes its own
# run. Every job but the last ends by collecting what it found into one
# results file and uploading it as `release-results-<key>`; the `report` job
# builds the release report from all of them and fails the run on anything
# its `problems` list (scripts/release-report/report.mjs).
#
# Six jobs leave results, because six things exist to prove: the build,
# types, lint rules, format, packaging, licences and the repository's guards
# (`verify`); each package's suite on a runner of its own (`test`); the
# Studio in a real browser, and the README's pictures of it held to the text
# they show (`browser`); the packed tarballs in projects that are not this one
# (`install`), which also compiles and runs docs/getting-started.md's code
# (0015); the e-invoice, the XML the runtime writes and the PDF/A-3b the
# renderer draws of it, judged by the validators a receiver runs
# (`e-invoice`, 0027, 0031); and the server's image, built from this
# checkout and run (`container`, 0046). A job added here is one the report
# expects results from: it needs a collect step, and collect.mjs a reader
# for it.
#
# A release runs code from here with its own permissions, so third-party
# actions are pinned to commit hashes, with the tag in a comment, under
# release.yml's rule; scripts/workflows.test.mjs fails on one that is not.
on:
  workflow_call:
    inputs:
      release:
        description: "'' for CI, the tag for a release, dry-run for a rehearsal"
        type: string
        default: ''
    secrets:
      # Passed by ci.yml and never by release.yml, so a release never uploads
      # coverage and holds no secret while it runs the gates.
      CODECOV_TOKEN:
        required: false

# Read-only, for every job. Nothing in this workflow writes to the repository:
# the coverage upload authenticates with its own token, the caches are CI's
# alone and the artefacts the run's. Without this the default token carries
# whatever the repository's default is, and CodeQL says so, as a
# missing-workflow-permissions alert per job.
permissions:
  contents: read

jobs:
  # Build, types, lint rules, format, packaging, licences and the
  # repository's own guards: the fast signal. The suites run in the `test`
  # job below, one package per runner.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # corepack reads the packageManager field, so CI runs the exact pnpm
      # version the repo pins rather than whatever the runner image ships.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      # CI only. A tag's run may restore a cache a main-branch run saved, and
      # a cache holds whatever code that job ran left in the store; a release
      # or a rehearsal installs from the registry against the lockfile
      # instead, in every job here (workflows.test.mjs). The store's path is
      # assigned before it is written out, so a pnpm that cannot start fails
      # this step with its own message, never the cache step with an empty
      # path.
      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm typecheck

      # Every TypeScript and JavaScript file holds to the lint rules, the
      # type-aware ones reading the declarations the build just wrote, and to
      # Prettier's format, which the check only reads and never writes
      # (0050). The rules and the style are scripts/code-style/, a copy of
      # what formancy.ai will publish as @formancy/code-style for all four
      # repositories, until this repository pins that package instead.
      - run: pnpm lint
      - run: pnpm format:check

      # Packaging correctness (publint + attw) is a release gate, not a nicety:
      # broken exports maps are the top cause of "doesn't work in my app".
      - run: pnpm check:pkg

      # Every tarball carries LICENSE.md and NOTICE and declares the
      # source-available terms rather than the scope's Apache-2.0. On the pull
      # request rather than only at release, which is the last possible moment
      # to find out.
      - run: node scripts/verify-licenses.mjs

      # Everything a published package needs in production, and every font
      # one ships, is under a licence that allows public source and licensed
      # production use: permissive, never GPL, AGPL, non-commercial or none
      # (0006). Read from the tree this job installed, so CI sees Linux's
      # optional platform packages where a Windows machine sees its own.
      - run: node scripts/dependency-licences.mjs

      # The repository's own guards: codecov.yml matches its generator, every
      # CLA signature names the current text, upstream is depended on at exact
      # versions, no source file is past the 600-line budget, the `test`
      # job's matrix names every package with a suite, the README says what
      # LICENSE.md says, these workflows keep the shape the release depends
      # on, and the release report's registers hold. A guard that is not a
      # gate is a comment.
      - run: pnpm test:repo

      # What this job found, for the report: the guards' results and the
      # dist/ of every published package it built. Even when a step above
      # failed, so the report says what failed rather than that nothing came.
      # Every upload here overwrites: a job run again replaces its own earlier
      # attempt's artefact, which v4 would otherwise refuse by name, and no two
      # jobs share a key (workflows.test.mjs), so it never replaces another's.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job verify
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # Every package's suite, each in a job of its own on its own runner, as in
  # formancy.ai-data, where nine suites sharing one runner timed out a test
  # that takes two seconds alone. scripts/ci-test-jobs.test.mjs fails when
  # this list and the workspace's packages with a `test:coverage` script
  # disagree, so a new package cannot go untested in CI by being left off it.
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every suite reports, rather than the first failure cancelling the rest.
      fail-fast: false
      matrix:
        package: ['@formancy/report-spec', '@formancy/report-core', '@formancy/report-runtime', '@formancy/report-data-provider', '@formancy/report-forms', '@formancy/report-server-core', '@formancy/report-server', '@formancy/report-client', '@formancy/report-render-pdf', '@formancy/report-builder-core', '@formancy/report-builder-react', '@formancy/report-builder-angular', '@formancy/report-corpus', '@formancy/report-studio', '@formancy/report-pages']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # turbo builds what the package depends on first (`^build`), then runs
      # its suite and nothing else's. `--force` makes "this job did not replay
      # a cached result" a property of the command rather than an accident of
      # a fresh runner; `--summarize` writes the task's own start and end,
      # which the report shows as its wall time. The package reaches the
      # command through the environment, never through `${{ }}` in the
      # script.
      - run: pnpm exec turbo run test:coverage --filter="$PACKAGE" --force --summarize
        env:
          PACKAGE: ${{ matrix.package }}
      # Skipped, visibly, while the repository has no CODECOV_TOKEN -- a new
      # repository should not be red for a reason unrelated to its code -- and
      # in every release, which passes no secret. Once the secret exists the
      # upload runs and a failed upload fails the job, as upstream: a report
      # that silently did not arrive is a number nobody can read. Each job
      # uploads its own package's report; Codecov merges them by commit. A
      # secret cannot be tested in `if:` directly, so it goes through the
      # environment.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        # The commit formancy.ai-data pinned for v7.1.1, read from the action's repository on 2026-10-09.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job test --package "$PACKAGE"
        env:
          PACKAGE: ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true

  # What jsdom cannot see in the Studio, measured in Chromium: layout down to
  # 320 pixels, the keyboard's path, axe with contrast and target size
  # measured, the PDF printed in the page and drawn by PDF.js on white paper,
  # the framework switch, a pointer's drag, and no rule of the room's on the
  # paper (apps/studio/scripts/browser-test.mjs). Then the README's pictures,
  # walked again and held to the text they were recorded showing, and every
  # caption to what its parts say (0013, formancy.ai-data 0038). One job, as
  # formancy.ai-data's browser and pictures jobs are in theirs, and Chromium
  # only: the one browser this repository's gates have measured.
  #
  # Pinned, not ubuntu-latest, for formancy.ai-data's reason: the fallback
  # fonts and the system libraries Chromium draws with are the image's, and a
  # label that moved would move what the gate measures with no change here.
  # ubuntu-latest was ubuntu-24.04 on 2026-10-12 (formancy.ai-data). The
  # thirty minutes are not measured on CI: the gate took 2 m 53 s on a
  # Windows 11 workstation (i9-10900K) on 2026-10-16, before the pictures.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # Cached by the lockfile, which pins the playwright version the browser
      # revision is tied to; in CI only, as the store is.
      - name: Cache the chromium download
        uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      # No `--with-deps`, for formancy.ai's reason, which formancy.ai-data's
      # gates keep: it runs apt-get for libraries the hosted runner already
      # ships, and on formancy.ai that once sat for nineteen minutes until the
      # job timed out. If a library is ever missing, Chromium fails to launch
      # and says which; the step timeout is the backstop.
      - run: pnpm --filter @formancy/report-studio exec playwright install chromium
        timeout-minutes: 5

      # turbo builds the packages the Studio imports and the Studio itself
      # first (turbo.json's `dependsOn`); the gate then builds and serves the
      # page it measures. Never cached: a replayed pass measured nothing.
      - run: pnpm exec turbo run test:browser --filter=@formancy/report-studio

      # The pictures, walked on the page the gate measured. They were taken
      # on another machine; --check compares their text alone, with the web
      # fonts refused, so the platform's look does not enter it. Run when the
      # gate failed too, so a red gate does not hide the pictures' answer;
      # the job fails all the same.
      - run: pnpm exec turbo run test:pictures --filter=@formancy/report-studio
        if: ${{ !cancelled() }}

      # What the gate and the pictures' check found, for the report: each
      # writes its own file under apps/studio/test-results however its run
      # ends (browser-chromium.json, pictures.json), and the dist/ of every
      # published package turbo built for the Studio.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true
      # The gate's and the check's own files, whole, for whoever reads a red run.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: apps/studio/test-results/
          if-no-files-found: error
          overwrite: true

  # Every job above runs inside the workspace, against the tree it built from --
  # and a workspace sibling resolves a package through a symlink to its SOURCE
  # directory. So an exports map that is wrong for a real consumer can be right
  # for every test in the repository. This packs the tarballs, installs them
  # into a plain npm project, type-checks it with skipLibCheck OFF and runs it
  # under Node. Its own job so that `verify` stays the fast signal and a red
  # "install" says what is wrong. The tarballs it installed and ran are kept as
  # the run's `release-tarballs`: a release publishes exactly these, and the
  # report holds each to the dist/ every other job built.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The tarballs are built output, so there is nothing to pack without this.
      - run: pnpm build

      - run: node scripts/install-test.mjs --keep-tarballs release-tarballs

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job install
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarballs
          path: release-tarballs/
          if-no-files-found: error
          overwrite: true

  # The e-invoice gate (0027, 0031): Mustang, KoSIT's validator with its
  # XRechnung configuration, and veraPDF, at the releases
  # docs/release/e-invoice-tools.json pins, each fetched by URL and refused
  # unless its SHA-256 is the registered one, then run, with Java's HTTP and
  # HTTPS proxies at a dead port (a raw socket is not caught), over the CII
  # XML the runtime writes of every e-invoice sample of the corpus, Mustang
  # and KoSIT, and over the PDF/A-3b the renderer draws of it and of
  # variants that carry the first sample's e-invoice on other pages, veraPDF
  # and Mustang, and over controls broken one named way each, which every tool
  # must judge exactly as each expects -- Mustang never by its exit status
  # alone, which is 0 on a PDF whose XML is valid whatever its PDF/A says;
  # and report-spec's closed code lists and the rule ids its refusals name,
  # held to the schematrons those tools run, and the two shapes it holds a
  # seller's contact to, with the tests that read them, to XRechnung's
  # schematron in KoSIT's configuration (scripts/e-invoice.mjs, 0037). An
  # error fails the job; a warning or a notice fails it unless
  # scripts/e-invoice/accepted.json accepts it in that file. Its own job,
  # because it needs a Java and downloads of its own, and a red "e-invoice"
  # says which kind of wrong it is.
  #
  # The twenty minutes are not measured on CI. The job installs the
  # workspace and builds every package before the gate, as verify does in
  # its fifteen; on a Windows 11 workstation (i9-10900K) on 2026-10-17 that
  # build took 34 s uncached, and the gate itself, with the PDFs, on
  # 2026-10-18 from the cache: 59 and 61 s on Zulu 25, 82 s once beside other
  # work on the machine, and 89 s on Temurin 17, Mustang's seventeen runs most
  # of each; with the variants and two more controls, 103 s on Zulu 25 and
  # 130 s on Temurin 17, each beside other work, Mustang's twenty-six runs
  # most of each; with 0037's fourth sample and its control, on 2026-10-20,
  # 108.5 s on Zulu 25, Mustang's thirty-one runs 94.2 s of it. The bound
  # is for an install, a download or a runner having a
  # bad day, not for the work, until three green runs give a slowest time
  # to triple.
  e-invoice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The corpus is resolved by the runtime as built, not by its source.
      - run: pnpm build

      # The register's runtime: Mustang's and KoSIT's JARs need Java 11 (their
      # classes are version 55) and veraPDF's 8, and the gate passed on
      # Temurin 17.0.20.1 on 2026-10-17, and with veraPDF and the PDFs on
      # 2026-10-18. A third-party action in all but name, pinned like one: the
      # commit of v6.0.1, read from the action's repository that day, as
      # formancy.ai-health pins it.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      # CI only, like the pnpm store, and keyed on the register: a cached
      # download is used only once its SHA-256 is the registered one, and a
      # release fetches everything from where the register says.
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: .e-invoice-cache
          key: e-invoice-tools-${{ hashFiles('docs/release/e-invoice-tools.json') }}

      - run: node scripts/e-invoice.mjs --java "$JAVA_HOME/bin/java"

      # What this job found, for the report: the gate's own results file,
      # which it writes however its run ends, and the dist/ of every
      # published package this job built.
      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job e-invoice
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true
      # The results, the corpus as written -- the XML and the PDFs -- and
      # every tool's own output, whole, for whoever reads a red run.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e-invoice-results
          path: |
            test-results/e-invoice.json
            test-results/e-invoice/
          if-no-files-found: error
          overwrite: true

  # The server's image (0046), which nothing else here touches.
  # packages/report-server/src/dockerfile.test.ts catches a workspace
  # package the Dockerfile's COPY list forgot; this catches what it cannot --
  # a file the runtime stage drops, a module that resolves in the workspace
  # and not in the deployed tree, a setting main.ts does not read. formancy's
  # image once built cleanly, passed every test and exited on startup with
  # ERR_MODULE_NOT_FOUND, and Formancy Data's container job exists for that;
  # this is its shape, as a script (scripts/container.mjs) that builds the
  # image on the runner's own Docker, runs every check, removes every
  # container it started, and writes test-results/container.json however it
  # ends. Node and nothing else installed: the script and collect.mjs import
  # Node's built-ins alone, and the image installs what it needs from the
  # lockfile itself. What the report says of this image is labelled the
  # gate's image; this release publishes none.
  #
  # The twenty minutes are not measured on CI: the gate took 18 s with the
  # image's layers cached, and its build 42 s uncached, on a Windows 11
  # workstation's Docker Desktop (i9-10900K) on 2026-10-22, beside other
  # work. The bound is for a pull of the base image, the registry or a runner
  # having a bad day, until three green runs give a slowest time to triple.
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/container.mjs

      - name: Keep what this job found, for the report
        id: collect
        if: ${{ !cancelled() }}
        run: node scripts/release-report/collect.mjs --job container
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-results-${{ steps.collect.outputs.key }}
          path: release-results/
          if-no-files-found: error
          overwrite: true
      # The gate's record, whole, for whoever reads a red run.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: container-results
          path: test-results/container.json
          if-no-files-found: error
          overwrite: true

  # The release report (0014), built from what every job above found: what
  # this run was tested on -- Node, pnpm, TypeScript, upstream @formancy/*,
  # pdfmake, the React and Angular each install host resolved, and the
  # Chromium the browser gate launched with the Playwright that pins it --
  # every package's results, the browser gate's checks and the pictures'
  # check, the e-invoice gate's verdicts, the build identity of what a
  # release publishes, the release gates and the known limitations. It
  # fails the run on anything in its problems -- a job that ended other
  # than success, an artefact missing, twice or another run's, a test
  # skipped or failed, a browser check failed or a pass it planned not made,
  # a file the e-invoice gate judged otherwise than its corpus expects, a
  # tarball whose dist/ is not every job's -- and writes the report either
  # way, into the job summary and the `release-report` artefact. For a release or a
  # rehearsal it also writes the release body, and fails here, before
  # anything is published, when the body has no changelog section or is
  # longer than GitHub accepts.
  #
  # The limit is not measured on CI yet: it is verify's, whose install this
  # job shares, until three green runs give a slowest time to triple. The
  # checkout keeps the whole history, for a document's last change when a
  # gate's evidence is a document.
  report:
    needs: [verify, test, browser, install, e-invoice, container]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable pnpm

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store=$(pnpm store path --silent)
          echo "path=${store}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.release == ''
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # What the checkout says it is tested with is read from what is
      # installed: pdfmake, pdfjs-dist, TypeScript and the rest. Nothing is
      # built here; the report reads every other job's results.
      - run: pnpm install --frozen-lockfile

      # One directory per artefact, never merged: two jobs that wrote one key
      # stay two, and the report says so.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-results-*
          path: release-results

      - name: The report, from what every job found
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
        run: node scripts/release-report/report.mjs --results release-results --out release-report

      - name: The report, in the run's summary
        if: ${{ !cancelled() }}
        run: cat release-report/release-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-report
          path: release-report/
          if-no-files-found: error
          overwrite: true
